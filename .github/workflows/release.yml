name: Release Bundles

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Validate and build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Require the release tag to point into main
        run: git merge-base --is-ancestor "$GITHUB_SHA" "origin/main"

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install build dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Validate bundles
        run: |
          yamllint -c .yamllint.yml bundles examples
          python scripts/validate-bundles.py

      - name: Build bundle archives
        run: bash scripts/build-bundles.sh

      - name: Upload release payload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-payload
          path: |
            dist/*.tgz
            dist/SHA256SUMS
            dist/catalog.json
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download verified release payload
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: release-payload
          path: dist

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME"
          dist/*.tgz dist/SHA256SUMS dist/catalog.json
          --repo "$GITHUB_REPOSITORY"
          --verify-tag
          --generate-notes
