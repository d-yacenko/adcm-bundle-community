---
- type: cluster
  name: jupyterhub_cluster
  display_name: JupyterHub Cluster
  version: "1.86p3"
  license: EULA.txt
  adcm_min_version: 2.6.0
  description: "Single-host JupyterHub with PAM(login) auth, installed into Python venv."

- type: service
  name: jupyterhub
  display_name: JupyterHub
  version: "1.86p3"
  description: "JupyterHub service packaged as an ADCM service. Installs into venv, configures systemd and JupyterHub config, enables JupyterLab by default."
  config:
    - name: __main_info
      type: text
      default: |
        After installation JupyterHub web-interface is available on the HTTP listener
        configured below.

        Typical URL: http://host:28080/jupyter/hub/

        ===
        Author: D.Iatsenko <ydv@arenadata.io>
        Company: Arenadata Software.
      required: false
    - name: venv_dir
      display_name: Venv directory
      type: string
      default: /opt/jupyterhub/venv
    - name: root_dir
      display_name: Root directory for config file
      type: string
      default: /opt/jupyterhub
    - name: data_dir
      display_name: Data directory (cookie & sqlite)
      type: string
      default: /var/lib/jupyterhub
    - name: bind_host
      display_name: Bind host
      type: string
      default: "0.0.0.0"
    - name: bind_port
      display_name: Bind port
      type: integer
      default: 28080
    - name: hub_port
      display_name: Hub port
      description: Internal JupyterHub port used by the proxy and user servers
      type: integer
      default: 28081
    - name: base_url
      display_name: Base URL prefix
      type: string
      default: /jupyter
    - name: spawner_cmd
      display_name: Spawner cmd (jupyter-labhub or jupyterhub-singleuser)
      type: string
      default: jupyter-labhub
    - name: env_path
      display_name: PATH for single-user process
      type: string
      default: /opt/jupyterhub/venv/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/bin
    - name: pam_service
      display_name: PAM service name
      type: string
      default: login
    - name: allow_all
      display_name: Allow all local users
      type: boolean
      default: true
    - name: admin_users
      display_name: Admin users (space/comma-separated)
      type: string
      default: "root"
    - name: systemd_unit
      display_name: Systemd unit name
      type: string
      default: jupyterhub
    - name: service_user
      display_name: Systemd service User
      type: string
      default: "root"
      
  components:
    HUB:
      display_name: Hub
      constraint: [1, +]
  actions:
    install:
      display_name: Install
      type: task
      scripts:
        - name: install_deps
          display_name: Install OS deps & Node/CHP
          script_type: ansible
          script: ansible/install.yml
        - name: configure
          display_name: Render config & unit
          script_type: ansible
          script: ansible/configure.yml
        - name: start
          display_name: Start service
          script_type: ansible
          script: ansible/start.yml
      states:
        available: [created]
        on_success: installed
    configure:
      display_name: Configure
      type: job
      script_type: ansible
      script: ansible/configure.yml
      states:
        available: [installed]
    start:
      display_name: Start
      type: job
      script_type: ansible
      script: ansible/start.yml
      states:
        available: [installed]
    stop:
      display_name: Stop
      type: job
      script_type: ansible
      script: ansible/stop.yml
      states:
        available: [installed]
    restart:
      display_name: Restart
      type: job
      script_type: ansible
      script: ansible/restart.yml
      states:
        available: [installed]
    uninstall:
      display_name: Uninstall (remove files & unit)
      type: task
      scripts:
        - name: stop
          display_name: Stop
          script_type: ansible
          script: ansible/stop.yml
        - name: uninstall
          display_name: Remove files
          script_type: ansible
          script: ansible/uninstall.yml
      states:
        available: [installed]
    check: &common_action
      display_name: Check service
      type: job
      script_type: ansible
      script: ansible/check.yml
      states:
        available:
          - installed
          - stopped
          - failure
        on_fail: failure
    ensure_python_packages:
      display_name: "Ensure Python packages"
      type: job
      script_type: ansible
      script: ansible/ensure_python_packages.yml
      params:
        jinja2_native: true
      config:
        packages:
          display_name: "Список пакетов (pip)"
          type: list
          required: false
          default: []
        venv:
          display_name: "Путь к виртуальному окружению"
          type: string
          required: false
          default: ""  
      states:
        available: [installed, stopped, failure]
        on_fail: failure
    install_ijava_kernel:
      display_name: "Install IJava kernel"
      description: "Устанавливает Java kernel (IJava) в системный venv JupyterHub."
      type: job
      script_type: ansible
      script: ansible/install_ijava_kernel.yml
      params:
        jinja2_native: true
      config:
        jdk_package:
          display_name: "APT пакет JDK (openjdk-11/17-jdk)"
          type: string
          required: false
          default: "openjdk-17-jdk"
        ijava_version:
          display_name: "Версия IJava (release)"
          type: string
          required: false
          default: "1.3.0"
        archive_url:
          display_name: "URL архива IJava (оставьте пустым для auto)"
          type: string
          required: false
          default: ""
        extract_subdir:
          display_name: "Каталог внутри архива (например ijava-1.3.0)"
          type: string
          required: false
          default: ""
        install_scope:
          display_name: "Параметр install.py (--sys-prefix/--user)"
          type: string
          required: false
          default: "--sys-prefix"
        hub_venv:
          display_name: "Путь к venv JupyterHub (override)"
          type: string
          required: false
          default: ""
        kernel_display_name:
          display_name: "Имя ядра (display name)"
          type: string
          required: false
          default: "Rust (evcxr)"
        kernel_id:
          display_name: "Имя каталога ядра (kernel id)"
          type: string
          required: false
          default: "evcxr_jupyter"
      states:
        available: [installed, stopped, failure]
        on_fail: failure
    install_scala_kernel:
      display_name: "Install Scala (Almond) kernel"
      description: "Устанавливает Scala kernel (Almond) в системный venv JupyterHub через coursier."
      type: job
      script_type: ansible
      script: ansible/install_scala_kernel.yml
      params:
        jinja2_native: true
      config:
        jdk_package:
          display_name: "APT пакет JDK (openjdk-11-jdk/17-jdk)"
          type: string
          required: false
          default: "openjdk-11-jdk"
        coursier_url:
          display_name: "URL бинарника coursier (cs)"
          type: string
          required: false
          default: "https://github.com/coursier/launchers/raw/master/cs-x86_64-pc-linux"
        coursier_bin:
          display_name: "Путь установки coursier"
          type: string
          required: false
          default: "/usr/local/bin/cs"
        coursier_cache_dir:
          display_name: "Каталог кеша coursier"
          type: string
          required: false
          default: "/opt/jupyterhub/coursier-cache"
        kernel_display_name:
          display_name: "Имя ядра (display name)"
          type: string
          required: false
          default: "Scala (Almond)"
        kernel_id:
          display_name: "Имя каталога ядра (kernel id)"
          type: string
          required: false
          default: "scala-almond"
        hub_venv:
          display_name: "Путь к venv JupyterHub (override)"
          type: string
          required: false
          default: ""
      states:
        available: [installed, stopped, failure]
        on_fail: failure
    install_kotlin_kernel:
      display_name: "Install Kotlin kernel"
      description: "Устанавливает kotlin-jupyter-kernel в системный venv JupyterHub и регистрирует kernelspec."
      type: job
      script_type: ansible
      script: ansible/install_kotlin_kernel.yml
      params:
        jinja2_native: true
      config:
        jdk_package:
          display_name: "APT пакет JDK для Kotlin"
          type: string
          required: false
          default: "openjdk-17-jdk"
        pip_package:
          display_name: "pip-пакет ядра Kotlin"
          type: string
          required: false
          default: "kotlin-jupyter-kernel"
        cache_dir:
          display_name: "Каталог кеша Kotlin (общий)"
          type: string
          required: false
          default: "/opt/jupyterhub/kotlin-cache"
        libraries_dir:
          display_name: "Каталог библиотек Kotlin (общий)"
          type: string
          required: false
          default: "/opt/jupyterhub/kotlin-libraries"
        kernel_display_name:
          display_name: "Имя ядра (display name)"
          type: string
          required: false
          default: "Kotlin"
        kernel_id:
          display_name: "Имя каталога ядра (kernel id)"
          type: string
          required: false
          default: "kotlin"
        hub_venv:
          display_name: "Путь к venv JupyterHub (override)"
          type: string
          required: false
          default: ""
      states:
        available: [installed, stopped, failure]
        on_fail: failure
    install_c_kernel:
      display_name: "Install C (gcc) kernel"
      description: "Устанавливает Jupyter C kernel (jupyter-c-kernel) в системный venv JupyterHub."
      type: job
      script_type: ansible
      script: ansible/install_c_kernel.yml
      params:
        jinja2_native: true
      config:
        apt_packages:
          display_name: "APT пакеты toolchain (по умолчанию build-essential/gcc/g++/make)"
          type: list
          required: false
          default: []
        pip_package:
          display_name: "pip пакет (версия) jupyter-c-kernel"
          type: string
          required: false
          default: "jupyter-c-kernel"
        install_scope:
          display_name: "install_c_kernel scope (--sys-prefix/--user)"
          type: string
          required: false
          default: "--sys-prefix"
        hub_venv:
          display_name: "Путь к venv JupyterHub (override)"
          type: string
          required: false
          default: ""
      states:
        available: [installed, stopped, failure]
        on_fail: failure
    install_sql_kernel:
      display_name: "Install SQL kernel"
      description: "Устанавливает SQL kernel (jupyter-sql) в системный venv JupyterHub."
      type: job
      script_type: ansible
      script: ansible/install_sql_kernel.yml
      params:
        jinja2_native: true
      config:
        apt_packages:
          display_name: "APT пакеты для SQL ядра (по умолчанию sqlite3/libsqlite3-dev)"
          type: list
          required: false
          default: []
        pip_package:
          display_name: "pip пакет (версия) SQL ядра"
          type: string
          required: false
          default: "jupyter-sql"
        kernel_display_name:
          display_name: "Имя ядра (display name)"
          type: string
          required: false
          default: "SQL"
        kernel_id:
          display_name: "Имя каталога ядра (kernel id)"
          type: string
          required: false
          default: "sql"
        hub_venv:
          display_name: "Путь к venv JupyterHub (override)"
          type: string
          required: false
          default: ""
      states:
        available: [installed, stopped, failure]
        on_fail: failure
    install_r_kernel:
      display_name: "Install R (IRkernel) kernel"
      description: "Ставит IRkernel в системный venv JupyterHub и регистрирует kernelspec."
      type: job
      script_type: ansible
      script: ansible/install_r_kernel.yml
      params:
        jinja2_native: true
      config:
        apt_packages:
          display_name: "APT пакеты для R (по умолчанию r-base, dev и зависимости)"
          type: list
          required: false
          default: []
        cran_repo:
          display_name: "CRAN репозиторий"
          type: string
          required: false
          default: "https://cloud.r-project.org"
        r_packages:
          display_name: "R пакеты для установки"
          type: list
          required: false
          default:
            - dplyr
            - ggplot2
            - tidyr
            - tibble
        kernel_display_name:
          display_name: "Имя ядра (display name)"
          type: string
          required: false
          default: "R (IRkernel)"
        kernel_id:
          display_name: "Имя каталога ядра (kernel id)"
          type: string
          required: false
          default: "ir"
        hub_venv:
          display_name: "Путь к venv JupyterHub (override)"
          type: string
          required: false
          default: ""
      states:
        available: [installed, stopped, failure]
        on_fail: failure
    install_rust_kernel:
      display_name: "Install Rust (evcxr) kernel"
      description: "Устанавливает rustup/cargo в каталоги /opt и регистрирует evcxr_jupyter kernel внутри venv JupyterHub."
      type: job
      script_type: ansible
      script: ansible/install_rust_kernel.yml
      params:
        jinja2_native: true
      config:
        rust_toolchain:
          display_name: "Rust toolchain channel (stable/beta/nightly)"
          type: string
          required: false
          default: "stable"
        rustup_url:
          display_name: "URL скрипта rustup-init"
          type: string
          required: false
          default: "https://sh.rustup.rs"
        rustup_home:
          display_name: "Каталог RUSTUP_HOME"
          type: string
          required: false
          default: "/opt/jupyterhub/rustup"
        cargo_bin_dir:
          display_name: "Каталог cargo/bin"
          type: string
          required: false
          default: "/opt/jupyterhub/cargo/bin"
        rust_env_home:
          display_name: "Каталог HOME для evcxr/rustup"
          type: string
          required: false
          default: "/opt/jupyterhub/rust-home"
        kernel_display_name:
          display_name: "Имя ядра (display name)"
          type: string
          required: false
          default: "Rust (evcxr)"
        kernel_id:
          display_name: "Имя каталога ядра (kernel id)"
          type: string
          required: false
          default: "evcxr_jupyter"
        hub_venv:
          display_name: "Путь к venv JupyterHub (override)"
          type: string
          required: false
          default: ""
      states:
        available: [installed, stopped, failure]
        on_fail: failure
    install_csharp_kernel:
      display_name: "Install C# (.NET Interactive) kernel"
      description: "Устанавливает dotnet-interactive и регистрирует C# kernel для Jupyter."
      type: job
      script_type: ansible
      script: ansible/install_csharp_kernel.yml
      params:
        jinja2_native: true
      config:
        dotnet_feed:
          display_name: "Deb пакет feed'а Microsoft (или оставьте https://packages.microsoft.com/... deb)"
          type: string
          required: false
          default: "https://packages.microsoft.com/config/ubuntu/22.04/packages-microsoft-prod.deb"
        dotnet_sdk:
          display_name: "Пакет dotnet-sdk (например dotnet-sdk-8.0)"
          type: string
          required: false
          default: "dotnet-sdk-8.0"
        dotnet_tool_version:
          display_name: "Версия dotnet-interactive (NuGet, например 1.0.531202)"
          type: string
          required: false
          default: "1.0.506202"
        dotnet_tools_dir:
          display_name: "Каталог установки dotnet tool"
          type: string
          required: false
          default: "/opt/jupyterhub/dotnet-tools"
        kernel_display_name:
          display_name: "Имя ядра (display name)"
          type: string
          required: false
          default: "C# (.NET Interactive)"
        kernel_id:
          display_name: "Имя каталога ядра (kernel id)"
          type: string
          required: false
          default: "csharp-interactive"
        hub_venv:
          display_name: "Путь к venv JupyterHub (override)"
          type: string
          required: false
          default: ""
      states:
        available: [installed, stopped, failure]
        on_fail: failure
    install_pascal_kernel:
      display_name: "Install Pascal (Free Pascal) kernel"
      description: "Устанавливает Free Pascal Compiler и регистрирует Pascal kernel для Jupyter."
      type: job
      script_type: ansible
      script: ansible/install_pascal_kernel.yml
      params:
        jinja2_native: true
      config:
        fpc_package:
          display_name: "APT пакет Free Pascal Compiler"
          type: string
          required: false
          default: "fpc"
        apt_packages:
          display_name: "Дополнительные APT пакеты (по умолчанию fpc)"
          type: list
          required: false
          default: []
        pascal_bin_dir:
          display_name: "Каталог для скриптов Pascal kernel"
          type: string
          required: false
          default: "/opt/jupyterhub/pascal"
        kernel_display_name:
          display_name: "Имя ядра (display name)"
          type: string
          required: false
          default: "Pascal (Free Pascal)"
        kernel_id:
          display_name: "Имя каталога ядра (kernel id)"
          type: string
          required: false
          default: "pascal"
        hub_venv:
          display_name: "Путь к venv JupyterHub (override)"
          type: string
          required: false
          default: ""
      states:
        available: [installed, stopped, failure]
        on_fail: failure
    install_fortran_kernel:
      display_name: "Install FORTRAN (gfortran) kernel"
      description: "Устанавливает gfortran и регистрирует FORTRAN kernel для Jupyter."
      type: job
      script_type: ansible
      script: ansible/install_fortran_kernel.yml
      params:
        jinja2_native: true
      config:
        gfortran_package:
          display_name: "APT пакет gfortran"
          type: string
          required: false
          default: "gfortran"
        apt_packages:
          display_name: "Дополнительные APT пакеты для FORTRAN ядра"
          type: list
          required: false
          default: []
        fortran_bin_dir:
          display_name: "Каталог для скриптов FORTRAN kernel"
          type: string
          required: false
          default: "/opt/jupyterhub/fortran"
        kernel_display_name:
          display_name: "Имя ядра (display name)"
          type: string
          required: false
          default: "FORTRAN (gfortran)"
        kernel_id:
          display_name: "Имя каталога ядра (kernel id)"
          type: string
          required: false
          default: "fortran"
        hub_venv:
          display_name: "Путь к venv JupyterHub (override)"
          type: string
          required: false
          default: ""
      states:
        available: [installed, stopped, failure]
        on_fail: failure
    install_basic_kernel:
      display_name: "Install BASIC (FreeBASIC) kernel"
      description: "Устанавливает FreeBASIC и регистрирует BASIC kernel для Jupyter."
      type: job
      script_type: ansible
      script: ansible/install_basic_kernel.yml
      params:
        jinja2_native: true
      config:
        freebasic_version:
          display_name: "Версия FreeBASIC для установки"
          type: string
          required: false
          default: "1.09.0"
        freebasic_package:
          display_name: "APT пакет FreeBASIC (если доступен в репозиториях)"
          type: string
          required: false
          default: "freebasic"
        apt_packages:
          display_name: "Дополнительные APT пакеты для BASIC ядра"
          type: list
          required: false
          default: []
        basic_bin_dir:
          display_name: "Каталог для скриптов BASIC kernel"
          type: string
          required: false
          default: "/opt/jupyterhub/basic"
        kernel_display_name:
          display_name: "Имя ядра (display name)"
          type: string
          required: false
          default: "BASIC (FreeBASIC)"
        kernel_id:
          display_name: "Имя каталога ядра (kernel id)"
          type: string
          required: false
          default: "basic"
        hub_venv:
          display_name: "Путь к venv JupyterHub (override)"
          type: string
          required: false
          default: ""
      states:
        available: [installed, stopped, failure]
        on_fail: failure
    install_javascript_kernel:
      display_name: "Install JavaScript (Node.js) kernel"
      description: "Устанавливает ijavascript и регистрирует JavaScript kernel для Jupyter."
      type: job
      script_type: ansible
      script: ansible/install_javascript_kernel.yml
      params:
        jinja2_native: true
      config:
        npm_package:
          display_name: "npm-пакет ядра JavaScript"
          type: string
          required: false
          default: "ijavascript"
        kernel_display_name:
          display_name: "Имя ядра (display name)"
          type: string
          required: false
          default: "JavaScript (Node.js)"
        kernel_id:
          display_name: "Имя каталога ядра (kernel id)"
          type: string
          required: false
          default: "javascript"
        install_scope:
          display_name: "Параметр установки (не используется, оставьте пустым)"
          type: string
          required: false
          default: ""
        hub_venv:
          display_name: "Путь к venv JupyterHub (override)"
          type: string
          required: false
          default: ""
      states:
        available: [installed, stopped, failure]
        on_fail: failure
    install_typescript_kernel:
      display_name: "Install TypeScript (Node.js) kernel"
      description: "Устанавливает itypescript и регистрирует TypeScript kernel для Jupyter."
      type: job
      script_type: ansible
      script: ansible/install_typescript_kernel.yml
      params:
        jinja2_native: true
      config:
        npm_package:
          display_name: "npm-пакет ядра TypeScript"
          type: string
          required: false
          default: "itypescript"
        kernel_display_name:
          display_name: "Имя ядра (display name)"
          type: string
          required: false
          default: "TypeScript (Node.js)"
        kernel_id:
          display_name: "Имя каталога ядра (kernel id)"
          type: string
          required: false
          default: "typescript"
        install_scope:
          display_name: "Параметр установки (не используется, оставьте пустым)"
          type: string
          required: false
          default: ""
        hub_venv:
          display_name: "Путь к venv JupyterHub (override)"
          type: string
          required: false
          default: ""
      states:
        available: [installed, stopped, failure]
        on_fail: failure
    create_user_kernel:
      display_name: "Create user Jupyter kernel"
      description: "Создаёт пользовательское ядро Jupyter: отдельный venv и kernel spec у пользователя."
      type: job
      script_type: ansible
      script: ansible/create_user_kernel.yml
      params:
        jinja2_native: true
      config:
        username:
          display_name: "Имя пользователя (linux)"
          type: string
          required: true
          default: "admin"
        kernel_name:
          display_name: "Имя ядра (kernel name)"
          type: string
          required: true
          default: "test"
        venvs_root:
          display_name: "Каталог для пользовательских venv"
          type: string
          required: false
          default: "/opt/jupyter_users_venvs"
      states:
        available: [installed, stopped, failure]
