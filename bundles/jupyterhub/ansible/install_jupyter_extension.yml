---
- name: Install Jupyter extension (generic, via hub venv)
  hosts: all
  gather_facts: true
  become: true
  environment:
    LANG: C.UTF-8
    LC_ALL: C.UTF-8
    PYTHONIOENCODING: utf-8

  vars:
    ansible_python_interpreter: /usr/bin/python3

  tasks:
    - name: Validate input
      ansible.builtin.fail:
        msg: "Provide 'extension' (pip package name)."
      when: (job.config.extension | default('', true) | length) == 0

    # ------ compute derived vars for this block ------
    - name: Get vars kernel venv and install packages
      vars:
        username: "{{ job.config.username }}"
        kernel_name: "{{ job.config.kernel_name }}"
        commands: "{{ job.config.commands }}"
        venvs_root: "{{ job.config.venvs_root | default('/opt/jupyter_venvs', true) }}"
        hub_venv_dir: >-
          {{
            (
              (service is defined and service.config is defined and service.config.venv_dir is defined and service.config.venv_dir)
              or ((services | default({})).get('jupyterhub', {}).get('config', {}).get('venv_dir',''))
              or '/opt/jupyterhub/venv'
            ) | string
          }}
        ext_pkg: "{{ job.config.extension | string | regex_replace('^\\s+|\\s+$','') }}"
        hub_python: "{{ hub_venv_dir }}/bin/python"
        hub_jupyter: "{{ hub_venv_dir }}/bin/jupyter"
        hub_pip: "{{ hub_venv_dir }}/bin/pip"
      block:
        - name: Ensure venvs_root exists
          ansible.builtin.file:
            path: "{{ venvs_root }}"
            state: directory
            mode: "0755"

        - name: Debug incoming vars
          debug:
            msg:
              ext_pkg: "{{ ext_pkg | default('—', true) }}"
              hub_python: "{{ hub_python | default('—', true) }}"
              hub_jupyter: "{{ hub_jupyter | default('—', true) }}"
              hub_pip: "{{ hub_pip | default('—', true) }}"
              commands: "{{ commands | default('—', true) }}"
              
        - name: Install apt update
          command: "sudo DEBIAN_FRONTEND=noninteractive apt-get -yq -o Dpkg::Options::=\"--force-confdef\" -o Dpkg::Options::=\"--force-confold\" update"
          when:
            - commands | default(false)
            
        - name: Install apt upgrade
          command: "sudo DEBIAN_FRONTEND=noninteractive apt-get -yq -o Dpkg::Options::=\"--force-confdef\" -o Dpkg::Options::=\"--force-confold\" upgrade"
          when:
            - commands | default(false)
            
        - name: Install additional commands
          command: "sudo DEBIAN_FRONTEND=noninteractive apt-get -yq -o Dpkg::Options::=\"--force-confdef\" -o Dpkg::Options::=\"--force-confold\" install {{ commands }}"
          when:
            - commands | default(false)
            
        - name: Ensure Times New Roman installed 
          shell: |
            set -euo pipefail
            export DEBIAN_FRONTEND=noninteractive
            if fc-list | grep -qi 'Times New Roman'; then
              echo "TNR present"; exit 0
            fi
            apt-get -yq update
            apt remove -y ttf-mscorefonts-installer
            apt-get -yq install ca-certificates cabextract fontconfig
            echo 'ttf-mscorefonts-installer msttcorefonts/accepted-mscorefonts-eula select true' | debconf-set-selections
            apt-get -y --reinstall install ttf-mscorefonts-installer
            fc-cache -f -v
            fc-match "Times New Roman" || true
          args:
            executable: /bin/bash
          register: out
          changed_when: "'TNR present' not in out.stdout"               
            
        - name: Install package into hub venv
          command: "{{ hub_pip }} install {{ ext_pkg }}"
 
        - name: Enable extension
          command: "{{ hub_jupyter }} server extension enable --sys-prefix {{ ext_pkg }}"

        - name: Rebuild JupyterLab (optional)
          command: "{{ hub_jupyter }} lab build --minimize=False"
          when:
            - job.config.rebuild_lab | default(false)
            
        - name: jupyter server extension list (print)
          command: "{{ hub_jupyter }} server extension list"
          register: _srv_list
          changed_when: false
          failed_when: false

        - name: Print server extension list
          debug:
            msg: "{{ _srv_list.stdout }}"
            
        - name: jupyter labextension list (print)
          command: "{{ hub_jupyter }} labextension list"
          register: _srv_list2
          changed_when: false
          failed_when: false

        - name: Print labextension list
          debug:
            msg: "{{ _srv_list2.stdout }}"
