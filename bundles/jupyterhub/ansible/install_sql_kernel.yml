# ansible/install_sql_kernel.yml
---
- name: Install SQL kernel into the JupyterHub venv
  hosts: all
  gather_facts: true
  become: true
  environment:
    LANG: C.UTF-8
    LC_ALL: C.UTF-8
    PYTHONIOENCODING: utf-8

  vars:
    ansible_python_interpreter: /usr/bin/python3

  tasks:
    - name: Ensure host uses Debian-family package manager
      ansible.builtin.fail:
        msg: "install_sql_kernel job supports only Debian/Ubuntu (APT)."
      when: ansible_os_family | lower not in ['debian']

    - name: Determine hub venv directory
      set_fact:
        hub_venv_dir: >-
          {{
            (
              (job.config.hub_venv | default('', true) | trim)
              or (
                service is defined
                and service.config is defined
                and service.config.venv_dir is defined
                and service.config.venv_dir
              )
              or ((services | default({})).get('jupyterhub', {}).get('config', {}).get('venv_dir',''))
              or '/opt/jupyterhub/venv'
            ) | string
          }}

    - name: Derive runtime variables
      set_fact:
        hub_bin_dir: "{{ hub_venv_dir.rstrip('/') }}/bin"
        hub_python: "{{ hub_venv_dir.rstrip('/') }}/bin/python3"
        hub_pip: "{{ hub_venv_dir.rstrip('/') }}/bin/pip"
        sql_kernel_pip_package: >-
          {{
            (job.config.pip_package | default('jupyter-sql', true) | trim)
            or 'jupyter-sql'
          }}
        sql_kernel_id: >-
          {{
            (job.config.kernel_id | default('sql', true) | trim)
            or 'sql'
          }}
        sql_kernel_display_name: >-
          {{
            (job.config.kernel_display_name | default('SQL', true) | trim)
            or 'SQL'
          }}
        sql_apt_packages_raw: "{{ job.config.apt_packages | default([], true) }}"

    - name: Build kernel directories
      set_fact:
        hub_kernels_dir: "{{ hub_venv_dir.rstrip('/') }}/share/jupyter/kernels"
        sql_kernel_dir: "{{ hub_venv_dir.rstrip('/') }}/share/jupyter/kernels/{{ sql_kernel_id }}"

    - name: Normalize apt packages list
      set_fact:
        sql_apt_packages: >-
          {{
            (sql_apt_packages_raw if (sql_apt_packages_raw is iterable and (sql_apt_packages_raw | length) > 0)
             else ['sqlite3', 'libsqlite3-dev'])
          }}

    - name: Ensure hub python exists
      ansible.builtin.stat:
        path: "{{ hub_python }}"
      register: hub_python_stat

    - name: Fail if hub python missing
      ansible.builtin.fail:
        msg: "Python interpreter {{ hub_python }} not found. Ensure JupyterHub venv exists."
      when: not hub_python_stat.stat.exists

    - name: Install required apt packages for SQL kernel
      ansible.builtin.apt:
        name: "{{ sql_apt_packages }}"
        state: present
        update_cache: true
      when: sql_apt_packages | length > 0
        
    - name: Install SQL kernel pip package into hub venv
      ansible.builtin.pip:
        name:
          - "{{ sql_kernel_pip_package }}"
          - "sqlalchemy<2.0"
          - "psycopg2-binary"
        executable: "{{ hub_pip }}"

    - name: Ensure kernels directory exists
      ansible.builtin.file:
        path: "{{ hub_kernels_dir }}"
        state: directory
        mode: "0755"

    - name: Ensure SQL kernel directory exists
      ansible.builtin.file:
        path: "{{ sql_kernel_dir }}"
        state: directory
        mode: "0755"

#    - name: Render SQL kernel spec locally
#      set_fact:
#        sql_kernel_spec_rendered: "{{ lookup('template', playbook_dir + '/templates/sql_kernel.json.j2', convert_data=False) }}"
#
    - name: Write kernel.json for SQL kernel
      # copy:
      template:
        src: sql_kernel.json.j2
        # src: "{{ sql_kernel_spec_rendered }}"
        dest: "{{ sql_kernel_dir }}/kernel.json"
        mode: "0644"
        # content: "{{ sql_kernel_spec_rendered }}"
    # - name:  Render SQL kernel spec locally
    #   set_fact:
    #     _json: "{{ lookup('template', playbook_dir + '/templates/sql_kernel.json.j2') }}"

    # # (опционально) проверим, что что-то отрендерилось
    # - name: Debug rendered json length
    #   debug:
    #     msg: "Rendered jsonlength: {{ _json | length }}"

    # # пишем скрипт на удалённый хост как контент
    # - name: Install json (copy content)
    #   copy:
    #     dest: "{{ sql_kernel_dir }}/kernel.json"
    #     mode: '0644'
    #     content: "{{ _json }}"
        
    - name: Show resulting kernel info
      debug:
        msg:
          hub_venv_dir: "{{ hub_venv_dir }}"
          pip_package: "{{ sql_kernel_pip_package }}"
          kernel_id: "{{ sql_kernel_id }}"
          kernel_dir: "{{ sql_kernel_dir }}"

    - name: Determine admin user home directory
      set_fact:
        admin_home: "/home/admin"

    - name: Ensure admin home directory exists
      file:
        path: "{{ admin_home }}"
        state: directory
        mode: "0755"
        owner: admin
        group: user

    - name: Copy sample notebook to admin home directory
      template:
        src: sample_sql.ipynb.j2
        dest: "{{ admin_home }}/sample_sql.ipynb"
        mode: "0644"
        owner: admin
        group: user

