# ansible/create_user_kernel.yml
---
- name: Create user Jupyter kernel
  hosts: all
  gather_facts: true
  become: true
  environment:
    LANG: C.UTF-8
    LC_ALL: C.UTF-8
    PYTHONIOENCODING: utf-8

  tasks:
    # ------ inputs & validation ------
    - name: Fail if username is empty
      ansible.builtin.fail:
        msg: "username is required"
      when: (job.config.username | default('', true) | length) == 0

    - name: Fail if kernel_name is empty
      ansible.builtin.fail:
        msg: "kernel_name is required"
      when: (job.config.kernel_name | default('', true) | length) == 0

    - name: Validate username characters
      ansible.builtin.fail:
        msg: "invalid username (allowed: [a-z0-9_-], must start with letter or _)"
      when: not (job.config.username is match('^[a-z_][a-z0-9_-]*$'))

    - name: Validate kernel_name characters
      ansible.builtin.fail:
        msg: "invalid kernel_name (allowed: letters, digits, . _ -)"
      when: not (job.config.kernel_name is match('^[A-Za-z0-9._-]+$'))

    - name: Ensure user exists
      ansible.builtin.getent:
        database: passwd
        key: "{{ job.config.username }}"
        fail_key: true

    # ------ compute derived vars for this block ------
    - name: Create kernel venv and register kernel
      vars:
        username: "{{ job.config.username }}"
        kernel_name: "{{ job.config.kernel_name }}"
        venvs_root: "{{ job.config.venvs_root | default('/opt/jupyter_venvs', true) }}"
        hub_venv_dir: >-
          {{
            (
              (service is defined and service.config is defined and service.config.venv_dir is defined and service.config.venv_dir)
              or ((services | default({})).get('jupyterhub', {}).get('config', {}).get('venv_dir',''))
              or '/opt/jupyterhub/venv'
            ) | string
          }}
        hub_python: "{{ hub_venv_dir }}/bin/python"
        venv_path: "{{ venvs_root }}/{{ kernel_name }}_venv"
        pip_exec: "{{ venv_path }}/bin/pip"
      block:
        - name: Ensure venvs_root exists
          ansible.builtin.file:
            path: "{{ venvs_root }}"
            state: directory
            mode: "0755"

        - name: Debug incoming vars
          debug:
            msg:
              hub_python: "{{ hub_python | default('—', true) }}"
              venv_path: "{{ venv_path | default('—', true) }}"
              kernel_name: "{{ kernel_name | default('—', true) }}"
              
        - name: Create user venv
          command: "{{ hub_python }} -m venv {{ venv_path }} --prompt {{ kernel_name }}"
          args:
            creates: "{{ venv_path }}/bin/python"

        - name: Chown venv to user
          ansible.builtin.file:
            path: "{{ venv_path }}"
            owner: "{{ username }}"
            recurse: true

        - name: Upgrade pip in venv (as user)
          ansible.builtin.pip:
            name: pip
            state: latest
            executable: "{{ pip_exec }}"
          become_user: "{{ username }}"

        - name: Install ipykernel in venv (as user)
          ansible.builtin.pip:
            name: ipykernel
            state: present
            executable: "{{ pip_exec }}"
          become_user: "{{ username }}"

        # Регистрация kernel spec у пользователя
        - name: Register kernel spec for user
          command: "{{ venv_path }}/bin/python -m ipykernel install --user --name {{ kernel_name }}"
          become_user: "{{ username }}"

          
