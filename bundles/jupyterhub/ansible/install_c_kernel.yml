# ansible/install_c_kernel.yml
---
- name: Install C (gcc) kernel into the JupyterHub venv
  hosts: all
  gather_facts: true
  become: true
  environment:
    LANG: C.UTF-8
    LC_ALL: C.UTF-8
    PYTHONIOENCODING: utf-8

  vars:
    ansible_python_interpreter: /usr/bin/python3

  tasks:
    - name: Ensure host uses Debian-family package manager
      ansible.builtin.fail:
        msg: "install_c_kernel job supports only Debian/Ubuntu (APT)."
      when: ansible_os_family | lower not in ['debian']

    - name: Determine hub venv directory
      set_fact:
        hub_venv_dir: >-
          {{
            (
              (job.config.hub_venv | default('', true) | trim)
              or (
                service is defined
                and service.config is defined
                and service.config.venv_dir is defined
                and service.config.venv_dir
              )
              or ((services | default({})).get('jupyterhub', {}).get('config', {}).get('venv_dir',''))
              or '/opt/jupyterhub/venv'
            ) | string
          }}

    - name: Derive runtime variables
      set_fact:
        hub_bin_dir: "{{ hub_venv_dir.rstrip('/') }}/bin"
        hub_python: "{{ hub_venv_dir.rstrip('/') }}/bin/python3"
        hub_pip: "{{ hub_venv_dir.rstrip('/') }}/bin/pip"
        c_kernel_install_scope: "{{ (job.config.install_scope | default('--sys-prefix', true) | trim) or '--sys-prefix' }}"
        c_kernel_pip_package: >-
          {{
            (job.config.pip_package | default('jupyter-c-kernel', true) | trim)
            or 'jupyter-c-kernel'
          }}
        apt_packages_raw: "{{ job.config.apt_packages | default([], true) }}"

    - name: Normalize apt packages list
      set_fact:
        apt_packages: >-
          {{
            (apt_packages_raw if (apt_packages_raw is iterable and (apt_packages_raw | length) > 0)
             else [
               'build-essential',
               'gcc',
               'g++',
               'make',
               'gcc-multilib',
               'libc6-dev',
               'libc6-dev-i386'
             ])
          }}

    - name: Ensure hub python exists
      ansible.builtin.stat:
        path: "{{ hub_python }}"
      register: hub_python_stat

    - name: Fail if hub python missing
      ansible.builtin.fail:
        msg: "Python interpreter {{ hub_python }} not found. Ensure JupyterHub venv exists."
      when: not hub_python_stat.stat.exists

    - name: Install required APT packages for gcc toolchain
      ansible.builtin.apt:
        name: "{{ apt_packages }}"
        state: present
        update_cache: true

    - name: Install jupyter-c-kernel into the hub venv
      ansible.builtin.pip:
        name: "{{ c_kernel_pip_package }}"
        executable: "{{ hub_pip }}"

    - name: Run install_c_kernel helper
      command: "{{ hub_bin_dir }}/install_c_kernel {{ c_kernel_install_scope }}"
      environment:
        PATH: "{{ hub_bin_dir }}:/usr/local/bin:/usr/bin:/bin"

    - name: Show resulting kernel info
      debug:
        msg:
          hub_venv_dir: "{{ hub_venv_dir }}"
          pip_package: "{{ c_kernel_pip_package }}"
          scope: "{{ c_kernel_install_scope }}"

    - name: Determine admin user home directory
      set_fact:
        admin_home: "/home/admin"

    - name: Ensure admin home directory exists
      file:
        path: "{{ admin_home }}"
        state: directory
        mode: "0755"
        owner: admin

    - name: Copy sample notebook to admin home directory
      template:
        src: sample_c_asm.ipynb.j2
        dest: "{{ admin_home }}/sample_c_asm.ipynb"
        mode: "0644"
        owner: admin
