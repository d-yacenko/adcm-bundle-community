# ansible/install_pascal_kernel.yml
---
- name: Install Pascal (Free Pascal) kernel into the JupyterHub venv
  hosts: all
  gather_facts: true
  become: true
  environment:
    LANG: C.UTF-8
    LC_ALL: C.UTF-8
    PYTHONIOENCODING: utf-8

  vars:
    ansible_python_interpreter: /usr/bin/python3

  tasks:
    - name: Ensure host uses Debian-family package manager
      ansible.builtin.fail:
        msg: "install_pascal_kernel job supports only Debian/Ubuntu (APT)."
      when: ansible_os_family | lower not in ['debian']

    - name: Determine hub venv directory
      set_fact:
        hub_venv_dir: >-
          {{
            (
              (job.config.hub_venv | default('', true) | trim)
              or (
                service is defined
                and service.config is defined
                and service.config.venv_dir is defined
                and service.config.venv_dir
              )
              or ((services | default({})).get('jupyterhub', {}).get('config', {}).get('venv_dir',''))
              or '/opt/jupyterhub/venv'
            ) | string
          }}

    - name: Derive runtime variables
      set_fact:
        hub_bin_dir: "{{ hub_venv_dir.rstrip('/') }}/bin"
        hub_python: "{{ hub_venv_dir.rstrip('/') }}/bin/python3"
        hub_pip: "{{ hub_venv_dir.rstrip('/') }}/bin/pip"
        pascal_kernel_id: >-
          {{
            (job.config.kernel_id | default('pascal', true) | trim) or 'pascal'
          }}
        pascal_kernel_display_name: >-
          {{
            (job.config.kernel_display_name | default('Pascal (Free Pascal)', true) | trim) or 'Pascal (Free Pascal)'
          }}
        fpc_package: >-
          {{
            (job.config.fpc_package | default('fpc', true) | trim) or 'fpc'
          }}
        pascal_apt_packages_raw: "{{ job.config.apt_packages | default([], true) }}"
        pascal_bin_dir: >-
          {{
            (job.config.pascal_bin_dir | default('/opt/jupyterhub/pascal', true) | trim) or '/opt/jupyterhub/pascal'
          }}

    - name: Build kernel directories
      set_fact:
        hub_kernels_dir: "{{ hub_venv_dir.rstrip('/') }}/share/jupyter/kernels"
        pascal_kernel_dir: "{{ hub_venv_dir.rstrip('/') }}/share/jupyter/kernels/{{ pascal_kernel_id }}"
        pascal_scripts_dir: "{{ pascal_bin_dir.rstrip('/') }}/scripts"

    - name: Normalize apt packages list
      set_fact:
        pascal_apt_packages: >-
          {{
            (pascal_apt_packages_raw if (pascal_apt_packages_raw is iterable and (pascal_apt_packages_raw | length) > 0)
             else [fpc_package])
          }}

    - name: Ensure hub python exists
      ansible.builtin.stat:
        path: "{{ hub_python }}"
      register: hub_python_stat

    - name: Fail if hub python missing
      ansible.builtin.fail:
        msg: "Python interpreter {{ hub_python }} not found. Ensure JupyterHub venv exists."
      when: not hub_python_stat.stat.exists

    - name: Install required APT packages for Free Pascal
      ansible.builtin.apt:
        name: "{{ pascal_apt_packages }}"
        state: present
        update_cache: true

    - name: Ensure Pascal scripts directory exists
      ansible.builtin.file:
        path: "{{ pascal_scripts_dir }}"
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Ensure kernels directory exists
      ansible.builtin.file:
        path: "{{ hub_kernels_dir }}"
        state: directory
        mode: "0755"

    - name: Ensure Pascal kernel directory exists
      ansible.builtin.file:
        path: "{{ pascal_kernel_dir }}"
        state: directory
        mode: "0755"

    - name: Create Pascal kernel wrapper script
      template:
        src: pascal_kernel.py.j2
        dest: "{{ pascal_scripts_dir }}/pascal_kernel.py"
        mode: "0755"

    - name: Install ipykernel if not present
      ansible.builtin.pip:
        name: ipykernel
        executable: "{{ hub_pip }}"

    - name: Create Pascal kernel.json
      copy:
        dest: "{{ pascal_kernel_dir }}/kernel.json"
        mode: "0644"
        content: |
          {
            "argv": [
              "{{ hub_python }}",
              "{{ pascal_scripts_dir }}/pascal_kernel.py",
              "-f",
              "{connection_file}"
            ],
            "display_name": "{{ pascal_kernel_display_name }}",
            "language": "pascal",
            "mimetype": "text/x-pascal",
            "file_extension": ".pas"
          }

    - name: Show resulting kernel info
      debug:
        msg:
          hub_venv_dir: "{{ hub_venv_dir }}"
          kernel_id: "{{ pascal_kernel_id }}"
          kernel_dir: "{{ pascal_kernel_dir }}"
          fpc_package: "{{ fpc_package }}"
          pascal_bin_dir: "{{ pascal_bin_dir }}"

    - name: Determine admin user home directory
      set_fact:
        admin_home: "/home/admin"

    - name: Ensure admin home directory exists
      file:
        path: "{{ admin_home }}"
        state: directory
        mode: "0755"
        owner: admin

    - name: Copy sample notebook to admin home directory
      template:
        src: sample_pascal.ipynb.j2
        dest: "{{ admin_home }}/sample_pascal.ipynb"
        mode: "0644"
        owner: admin
