---
- name: Debug incoming vars
  debug:
    msg:
      passed_service_name: "{{ service_name | default('—', true) }}"
      passed_component_id: "{{ component_id | default('—', true) }}"
      passed_host_id: "{{ host_id | default('—', true) }}"

- name: Ensure base directory for dedicated checkers exists
  ansible.builtin.file:
    path: /usr/lib/adcm-status-checker
    state: directory
    mode: '0755'

- name: Define checker paths
  set_fact:
    checker_script_path: "/usr/lib/adcm-status-checker/checker-{{ component_id }}.sh"
    checker_unit_name: "adcm-status-checker-{{ component_id }}"
    checker_unit_path: "/etc/systemd/system/adcm-status-checker-{{ component_id }}.service"


- name: Install dedicated checker script
  template:
    src: adcm-status-checker.sh.j2
    dest: "{{ checker_script_path }}"
    mode: '0755'
# Поэтому делаем вручную в 4-е подхода
