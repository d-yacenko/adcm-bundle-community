- name: Install dedicated checker unit
  template:
    src: adcm-status-checker.service.j2
    dest: "{{ checker_unit_path }}"
    mode: '0644'
# Поэтому делаем вручную в 3-и подхода
# рендерим шаблон ЛОКАЛЬНО (на контроллере)
# - name: Render checker script via lookup(template)
#   set_fact:
#     _checker_script: "{{ lookup('template', role_path + '/templates/adcm-status-checker.service.j2') }}"

# # (опционально) проверим, что что-то отрендерилось
# - name: Debug rendered script length
#   debug:
#     msg: "Rendered checker script length: {{ _checker_script | length }}"

# # пишем скрипт на удалённый хост как контент
# - name: Install checker script (copy content)
#   copy:
#     dest: "{{ checker_unit_path }}"
#     mode: '0755'
#     content: "{{ _checker_script }}"

- name: Reload systemd
  ansible.builtin.systemd:
    daemon_reload: yes

- name: Ensure dedicated ADCM status checker is enabled and started
  ansible.builtin.systemd:
    name: "{{ checker_unit_name }}"
    enabled: yes
    state: started

