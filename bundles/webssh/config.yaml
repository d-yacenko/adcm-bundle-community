- type: cluster
  name: webssh_cluster
  display_name: WebSSH Cluster
  version: "1.0.5"
  license: EULA.txt
  adcm_min_version: 2.6.0
  description: "Single-host WebSSH (web-based SSH terminal) on Ubuntu 22.04 (Jammy)."

- type: service
  name: webssh
  display_name: WebSSH Web Terminal
  version: "1.0.5"
  description: "Installs WebSSH (Python-based web SSH client) on Ubuntu 22.04 and exposes it via systemd service."
  config:
    - name: __main_info
      type: text
      default: |
        WebSSH provides a web-based SSH client accessible from a browser.

        By default the bundled service listens on port 22222.

        You can prefill connection parameters via URL, for example:
        http://<host>:22222/?hostname=<host>&port=22&username=admin&password=<BASE64>
        where password is base64-encoded.

        ===
        Author: D.V.Iatsenko
        Company: Arenadata.
      required: false
    - name: port
      display_name: WebSSH listen port
      type: integer
      default: 22222
    - name: base_url
      display_name: (unused) Legacy base URL
      type: string
      default: /
    - name: systemd_unit
      display_name: Systemd unit name
      type: string
      default: webssh
    - name: ssh_user
      display_name: (unused) Legacy SSH user
      type: string
      default: root
  components:
    TTY:
      display_name: Web terminal
      constraint: [1, +]
  actions:
    install:
      display_name: Install
      type: job
      script_type: ansible
      script: ansible/install_webssh.yml
      states:
        available: [created]
        on_success: installed
    configure:
      display_name: Configure
      type: job
      script_type: ansible
      script: ansible/configure_webssh.yml
      states:
        available: [installed]
    start:
      display_name: Start
      type: job
      script_type: ansible
      script: ansible/start_webssh.yml
      states:
        available: [installed]
    stop:
      display_name: Stop
      type: job
      script_type: ansible
      script: ansible/stop_webssh.yml
      states:
        available: [installed]
    restart:
      display_name: Restart
      type: job
      script_type: ansible
      script: ansible/restart_webssh.yml
      states:
        available: [installed]
    uninstall:
      display_name: Uninstall
      type: job
      script_type: ansible
      script: ansible/uninstall_webssh.yml
      states:
        available: [installed]
    check:
      display_name: Check
      type: task
      scripts:
        - name: status
          script_type: ansible
          script: ansible/check_webssh.yml
      states:
        available:
          - installed
          - stopped
          - failure
        on_fail: failure
