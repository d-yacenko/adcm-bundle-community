---
- type: cluster
  name: superset_cluster
  display_name: Superset Cluster
  version: "1.0.1"
  license: LICENSE
  adcm_min_version: 2.6.0
  description: "Single-host Apache Superset (Docker Compose) on Ubuntu 22.04 (Jammy)."

- type: service
  name: superset
  display_name: Apache Superset
  version: "1.0.1"
  description: "Installs Apache Superset via official Docker images, configures admin password and loads examples."
  config:
    - name: __main_info
      type: text
      default: |
        After installation Superset UI is available at:
        http://<host>:8088

        Default username: admin
        Password is set via the service config.

        ===
        Author: D.V.Iatsenko
        Company: Arenadata.
      required: false
    - name: superset_version
      display_name: Superset version (Docker image tag)
      type: string
      default: "4.1.1"
    - name: admin_password
      display_name: Admin password
      type: password
      required: true
  components:
    WEB:
      display_name: Web
      constraint: [1, +]
  actions:
    install:
      display_name: Install
      type: job
      script_type: ansible
      script: ansible/install.yml
      states:
        available: [created]
        on_success: installed
    configure:
      display_name: Configure
      type: job
      script_type: ansible
      script: ansible/configure.yml
      states:
        available: [installed]
    start:
      display_name: Start
      type: job
      script_type: ansible
      script: ansible/start.yml
      states:
        available: [installed]
    stop:
      display_name: Stop
      type: job
      script_type: ansible
      script: ansible/stop.yml
      states:
        available: [installed]
    restart:
      display_name: Restart
      type: job
      script_type: ansible
      script: ansible/restart.yml
      states:
        available: [installed]
    uninstall:
      display_name: Uninstall
      type: job
      script_type: ansible
      script: ansible/uninstall.yml
      states:
        available: [installed]
    check:
      display_name: Check
      type: task
      scripts:
        - name: status
          script_type: ansible
          script: ansible/check.yml
      states:
        available:
          - installed
          - stopped
          - failure
        on_fail: failure
